<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="100" fill="#080b11"/>
  
  <!-- Outer glowing shield outline -->
  <path d="M256 60 L410 130 C410 280 256 420 256 420 C256 420 102 280 102 130 Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Inner Crest -->
  <path d="M256 95 L375 150 C375 270 256 385 256 385 C256 385 137 270 137 150 Z" 
        fill="#111827" stroke="#1e293b" stroke-width="6"/>

  <!-- Tactical Cross / Sword Star -->
  <path d="M256 140 L266 220 L330 240 L266 260 L256 340 L246 260 L182 240 L246 220 Z" 
        fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Level 7 Core Gem -->
  <circle cx="256" cy="240" r="16" fill="#f8fafc" />
</svg>
